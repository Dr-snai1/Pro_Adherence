name: Stage 2 focused offline ingestion tests

on:
  push:
    branches:
      - "stage2/**"
    paths:
      - "src/pro_adherence/stage2_sources.py"
      - "tests/test_stage2_sources.py"
      - "tests/test_stage2_wos_ui_export.py"
      - "scripts/stage2/wos_ui_export.py"
      - "scripts/stage2/wos_drive_session.py"
      - "scripts/stage2/start_wos_export_windows.ps1"
      - "tests/test_stage2_wos_drive_session.py"
      - "scripts/stage2/wos_search_plan.py"
      - "tests/test_stage2_wos_search_plan.py"
      - "configs/pubmed/medication-adherence-SELECTED.v1.json"
      - ".github/workflows/stage2-tests.yml"
  pull_request:
    paths:
      - "src/pro_adherence/stage2_sources.py"
      - "tests/test_stage2_sources.py"
      - "tests/test_stage2_wos_ui_export.py"
      - "scripts/stage2/wos_ui_export.py"
      - "scripts/stage2/wos_drive_session.py"
      - "scripts/stage2/start_wos_export_windows.ps1"
      - "tests/test_stage2_wos_drive_session.py"
      - "scripts/stage2/wos_search_plan.py"
      - "tests/test_stage2_wos_search_plan.py"
      - "configs/pubmed/medication-adherence-SELECTED.v1.json"
      - ".github/workflows/stage2-tests.yml"

permissions:
  contents: read

jobs:
  offline-stage2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run only Stage 2 synthetic offline tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_stage2_*.py' -v

  windows-launcher-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Parse owner-approved Windows launcher (syntax only, NO execution)
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/stage2/start_wos_export_windows.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host "POWER_SHELL_SYNTAX_PASS (no WoS/Drive session started)"

      - name: Execute Windows PowerShell 5.1 version preflight (NO WoS/Drive)
        shell: pwsh
        run: |
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File "$PWD\scripts\stage2\start_wos_export_windows.ps1" -PreflightOnly
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 5.1 Python version preflight failed" }
