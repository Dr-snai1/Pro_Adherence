name: Stage3 PubMedBERT HDBSCAN pilot source-free tests
on:
  push:
    branches:
      - "work/stage3-classical-citation-20261114"
    paths:
      - "scripts/stage3_pubmedbert_hdbscan_ingest.py"
      - "scripts/stage3_pubmedbert_hdbscan_pilot.py"
      - "scripts/stage3_pubmedbert_hdbscan_audit.py"
      - "tests/test_stage3_pubmedbert_hdbscan.py"
      - ".github/workflows/stage3-pubmedbert-hdbscan-pilot-synthetic.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pubmedbert-source-free:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned diagnostics runtime
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0
      - name: Run exact MST extraction and nested sample tests
        run: PYTHONPATH=scripts OPENBLAS_NUM_THREADS=2 python -m unittest discover -s tests -p 'test_stage3_pubmedbert_hdbscan.py' -v
