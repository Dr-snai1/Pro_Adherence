name: Stage3 classical synthetic tests
on:
  push:
    branches:
      - "work/stage3-classical-citation-20261114"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classical-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.16"
      - name: Install pinned NumPy for citation projections
        run: python -m pip install --disable-pip-version-check --no-deps numpy==2.3.5
      - name: Run source-free co-citation and coupling tests
        run: python -m unittest discover -s tests -p 'test_stage3_classical_citation_networks.py' -v
      - name: Run source-free metadata observation tests
        run: python -m unittest discover -s tests -p 'test_stage3_classical_observational_metadata.py' -v
