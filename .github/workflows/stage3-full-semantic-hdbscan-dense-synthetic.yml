name: Stage3 exact disk-backed full semantic HDBSCAN tests
on:
  push:
    branches:
      - "work/stage3-classical-citation-20261114"
    paths:
      - "scripts/stage3_full_semantic_hdbscan_dense_exact.py"
      - "tests/test_stage3_full_semantic_hdbscan_dense_exact.py"
      - ".github/workflows/stage3-full-semantic-hdbscan-dense-synthetic.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disk-backed-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned numeric packages
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0
      - name: Run source-free exact numerical equivalence tests
        run: PYTHONPATH=scripts OPENBLAS_NUM_THREADS=2 python -m unittest discover -s tests -p 'test_stage3_full_semantic_hdbscan_dense_exact.py' -v
