name: Stage3 sparse coupling and HDBSCAN source-free tests
on:
  push:
    branches:
      - "work/stage3-classical-citation-20261114"
    paths:
      - "scripts/stage3_sparse_coupling_louvain.py"
      - "scripts/stage3_hdbscan_node2vec.py"
      - "tests/test_stage3_sparse_coupling_louvain.py"
      - "tests/test_stage3_hdbscan_node2vec.py"
      - ".github/workflows/stage3-community-sparse-hdbscan-synthetic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-free-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned source-free dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 numba==0.65.1 scikit-learn==1.8.0 networkx==3.6.1
      - name: Execute sparse coupling tests
        run: PYTHONPATH=scripts NUMBA_NUM_THREADS=1 python -m unittest discover -s tests -p 'test_stage3_sparse_coupling_louvain.py' -v
      - name: Execute HDBSCAN tests
        run: PYTHONPATH=scripts python -m unittest discover -s tests -p 'test_stage3_hdbscan_node2vec.py' -v
