name: Stage 0 tests

on:
  push:
    branches:
      - main
      - "pre-qa-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.16"

      - name: Install exact locked environment
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements.lock

      - name: Install project package
        run: python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .

      - name: Show runtime and locked dependencies
        run: |
          python --version
          python - <<'PY'
          import importlib.metadata
          for name in (
              "attrs", "jsonschema", "jsonschema-specifications", "pip",
              "referencing", "rpds-py", "setuptools", "wheel",
          ):
              print(name, importlib.metadata.version(name))
          PY

      - name: Verify bare installed package
        run: |
          env -u PYTHONPATH python -c "import pro_adherence; print(pro_adherence.__file__)"
          env -u PYTHONPATH python -m pro_adherence.validate contracts

      - name: Run Stage 0 tests
        run: env -u PYTHONPATH python -m unittest discover -s tests -p 'test_*.py'

      - name: Run focused validator commands bare
        run: |
          env -u PYTHONPATH python -m pro_adherence.validate contracts
          env -u PYTHONPATH python -m pro_adherence.validate corpus contracts/manifests/empty_corpus.manifest.json
          env -u PYTHONPATH python -m pro_adherence.validate release contracts/manifests/empty_release.manifest.json
          env -u PYTHONPATH python -m pro_adherence.validate lineage contracts/manifests/minimal_lineage.example.json
          env -u PYTHONPATH python -m pro_adherence.validate boundary

      - name: Run aggregate Stage 0 validator bare
        run: env -u PYTHONPATH python -m pro_adherence.validate stage0

      - name: Run deterministic Stage 0 materialization and restore E2E
        run: env -u PYTHONPATH python scripts/stage0_e2e.py

      - name: Run existing semantic mutation audit
        run: env -u PYTHONPATH python scripts/stage0_mutation_audit.py

      - name: Run closure-class mutation audit
        run: env -u PYTHONPATH python scripts/stage0_closure_mutation_audit.py

      - name: Run reusable PRE_QA static preflight
        run: |
          EXPECTED_PARENT="$(git rev-parse HEAD^)"
          env -u PYTHONPATH python scripts/pre_qa_gate.py \
            --expected-sha "${GITHUB_SHA}" \
            --expected-parent "${EXPECTED_PARENT}" \
            --architecture-revision 22 \
            --static-only

  portable-qa-runtime:
    runs-on: ubuntu-latest
    needs: contract-tests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute pinned OCI QA envelope
        run: |
          EXPECTED_PARENT="$(git rev-parse HEAD^)"
          bash scripts/run_pre_qa_exact_runtime.sh \
            --expected-sha "${GITHUB_SHA}" \
            --expected-parent "${EXPECTED_PARENT}" \
            --architecture-revision 22
