name: Stage 0 tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Show runtime
        run: |
          python --version
          python -c "import importlib.metadata; print('jsonschema', importlib.metadata.version('jsonschema'))"
      - name: Run Stage 0 tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Run aggregate Stage 0 validator
        env:
          PYTHONPATH: src
        run: python -m pro_adherence.validate stage0
      - name: Run semantic mutation audit
        env:
          PYTHONPATH: src
        run: python scripts/stage0_mutation_audit.py
