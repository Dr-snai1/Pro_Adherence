name: Stage 3 planning-only contracts (synthetic data)

on:
  push:
    branches:
      - "stage2/**"
      - "stage3/**"
    paths:
      - "src/pro_adherence/stage3_contracts.py"
      - "src/pro_adherence/stage3_preflight.py"
      - "tests/test_stage3_contracts.py"
      - "tests/test_stage3_preflight.py"
      - "tests/test_stage3_pilot_prepare.py"
      - "tests/test_stage3_pubmedbert_runner.py"
      - "configs/stage3/**"
      - "scripts/stage3_eligibility_census.py"
      - "scripts/stage3_pilot_prepare.py"
      - "scripts/stage3_p1_pubmedbert_local.py"
      - "scripts/stage3_graph_snapshot.py"
      - "scripts/stage3_graph_frozen_streaming.py"
      - "tests/test_stage3_pilot_plan.py"
      - "tests/test_stage3_hf_provenance.py"
      - "tests/test_stage3_small_file_integrity.py"
      - "tests/test_stage3_hf_public_evidence.py"
      - "src/pro_adherence/stage3_pilot_plan.py"
      - "src/pro_adherence/stage3_hf_provenance.py"
      - "src/pro_adherence/stage3_small_file_integrity.py"
      - "src/pro_adherence/stage3_runtime_guard.py"
      - "tests/test_stage3_graph_snapshot.py"
      - "tests/test_stage3_runtime_guard.py"
      - "scripts/stage3_node2vec_cpu_smoke.py"
      - "tests/test_stage3_node2vec_cpu_smoke.py"
      - "docs/stage3/**"
      - ".github/workflows/stage3-contracts.yml"
  pull_request:
    paths:
      - "src/pro_adherence/stage3_contracts.py"
      - "src/pro_adherence/stage3_preflight.py"
      - "tests/test_stage3_contracts.py"
      - "tests/test_stage3_preflight.py"
      - "tests/test_stage3_pilot_prepare.py"
      - "tests/test_stage3_pubmedbert_runner.py"
      - "configs/stage3/**"
      - "scripts/stage3_eligibility_census.py"
      - "scripts/stage3_pilot_prepare.py"
      - "scripts/stage3_p1_pubmedbert_local.py"
      - "scripts/stage3_node2vec_cpu_smoke.py"
      - "tests/test_stage3_node2vec_cpu_smoke.py"
      - "docs/stage3/**"
      - ".github/workflows/stage3-contracts.yml"

permissions:
  contents: read

jobs:
  offline-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate Stage3 contracts without models or private corpus
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_stage3_*.py' -v
      - name: Syntax and optimized-mode fail-closed smoke for frozen research graph CLI
        run: |
          python -m py_compile scripts/stage3_graph_frozen_streaming.py
          python -m py_compile scripts/stage3_node2vec_cpu_smoke.py src/pro_adherence/stage3_pilot_plan.py
          python -O scripts/stage3_graph_frozen_streaming.py --help > /tmp/stage3_optimized.out 2>&1 && exit 1 || grep -q 'Python assertions (-O forbidden)' /tmp/stage3_optimized.out

  node2vec-hashed-wheel-synthetic:
    # Public wheels only; no access to private research graph or source rows.
    # Runs a fresh hash-enforced install and tiny synthetic regressions only.
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install exact Linux x86-64 wheels by provider SHA256
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --only-binary=:all: -r configs/stage3/node2vec_cpu_cp313_linux_x86_64.requirements.txt
          python -m pip check
          python - <<'PY'
          import platform, sys
          from importlib.metadata import version
          assert sys.version_info[:2] == (3, 13)
          assert platform.machine().lower() == 'x86_64'
          for p, expected in {'gensim':'4.4.0','numpy':'2.3.5','scipy':'1.17.0','smart_open':'7.6.1','wrapt':'2.2.1'}.items():
              assert version(p)==expected,(p,version(p),expected)
          import gensim, numpy, scipy, smart_open, wrapt
          print('STAGE3_NODE2VEC_HASH_VERIFIED_FRESH_INSTALL_SYNTHETIC_ONLY')
          PY
      - name: Test repeatable stream and owner approved backend on synthetic graph
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p 'test_stage3_node2vec_cpu_smoke.py' -v
