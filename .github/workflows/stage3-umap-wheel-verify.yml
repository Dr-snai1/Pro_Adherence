name: Stage 3 pinned UMAP wheel verification
on:
  push:
    branches: [work/stage3-classical-citation-20261114]
    paths: ['.github/workflows/stage3-umap-wheel-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and verify exact public wheels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wheelhouse
          cat > /tmp/requirements.txt <<'EOF'
          umap-learn==0.5.9.post2 --hash=sha256:fbe51166561e0e7fab00ef3d516ac2621243b8d15cf4bef9f656d701736b16a0
          pynndescent==0.5.13 --hash=sha256:69aabb8f394bc631b6ac475a1c7f3994c54adf3f51cd63b2730fefba5771b949
          EOF
          python -m pip download --index-url https://pypi.org/simple --only-binary=:all: --no-deps --require-hashes -r /tmp/requirements.txt -d wheelhouse
          (cd wheelhouse && printf '%s\n' 'fbe51166561e0e7fab00ef3d516ac2621243b8d15cf4bef9f656d701736b16a0  umap_learn-0.5.9.post2-py3-none-any.whl' '69aabb8f394bc631b6ac475a1c7f3994c54adf3f51cd63b2730fefba5771b949  pynndescent-0.5.13-py3-none-any.whl' | sha256sum -c -)
          python -m zipfile -t wheelhouse/umap_learn-0.5.9.post2-py3-none-any.whl
          python -m zipfile -t wheelhouse/pynndescent-0.5.13-py3-none-any.whl
      - name: Retain verified public wheels for offline local install
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage3-umap-public-wheelhouse
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 7
