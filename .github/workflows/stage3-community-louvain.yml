name: Stage3 Louvain source-free checks
on:
  push:
    branches:
      - "work/stage3-classical-citation-20261114"
    paths:
      - "scripts/stage3_community_louvain.py"
      - "tests/test_stage3_community_louvain.py"
      - ".github/workflows/stage3-community-louvain.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  community-source-free:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install exact research diagnostic dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 networkx==3.6.1 scikit-learn==1.8.0
      - name: Run source-free Louvain and PAC1 tests
        run: python -m unittest discover -s tests -p 'test_stage3_community_louvain.py' -v
