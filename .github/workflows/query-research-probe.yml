name: Research PubMed query candidate probe
on:
  push:
    branches: [research/v04-query-candidates-20261019]
    paths:
      - 'research/create_validation_candidate_set.py'
      - '.github/workflows/query-research-probe.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/create_validation_candidate_set.py'
      - '.github/workflows/query-research-probe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-reference-cohort:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v04-query-candidates-20261019
          persist-credentials: true
      - name: Normalize line endings in candidate generator
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('research/create_validation_candidate_set.py')
          s=p.read_text()
          s=s.replace(chr(92)+'n# Stratified', chr(10)+'# Stratified').replace(chr(92)+'nNONPATIENT', chr(10)+'NONPATIENT').replace(chr(92)+'nB_HARD', chr(10)+'B_HARD')
          p.write_text(s)
          PY
          python -m py_compile research/create_validation_candidate_set.py
      - name: Generate provisional query reference cohort from PubMed
        run: python research/create_validation_candidate_set.py
      - name: Persist reproducible provisional cohort only on isolated research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/validation_candidate_set_20261019/
          git diff --cached --quiet && exit 0
          git commit -m "research: provisional 500R and 500N PubMed screening cohort [skip ci]"
          git push origin HEAD:research/v04-query-candidates-20261019
