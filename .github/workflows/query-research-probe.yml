name: Research PubMed query candidate probe
on:
  push:
    branches: [research/v04-query-candidates-20261019]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  pubmed-research-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: PubMed year-weighted independent sample and known-positive coverage
        run: |
          python research/weighted_sample_probe_20261019.py
